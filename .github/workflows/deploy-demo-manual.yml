name: Publicar Deriv DEMO en Cloudflare — aprobación manual
on:
  # v1.5: publish only after this workflow itself is explicitly reviewed and updated.
  # Every deployment keeps both broker DEMO buy switches OFF.
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-demo-manual.yml
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribir PUBLICAR_SOLO_LECTURA para subir el panel con DEMO habilitada SOLO bajo autorización del propietario y primer contrato validado'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-demo-manual-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmacion == 'PUBLICAR_SOLO_LECTURA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deriv-demo
    defaults:
      run:
        working-directory: cloudflare
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Instalar herramientas oficiales con dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Verificar compilación, reglas DEMO y protección de dinero real
        run: |
          npm run typecheck
          npm test
          npm run build
          npx cf deploy --prebuilt --mode production --dry-run
      - name: Rechazar HTML DEMO roto o scripts duplicados antes de desplegar
        run: (cd .. && node tests/test_html.mjs)
      - name: Bloquear importes obsoletos y exigir la misma lista en HTTP y riesgo DEMO
        run: |
          grep -F 'DEMO_STAKES_CENTS=Object.freeze([35,50,75,90,100]' src/demo-risk-policy.ts
          grep -F 'DEMO_AUTOMATIC_STAKES_CENTS=Object.freeze([35,50,75,100]' src/demo-risk-policy.ts
          grep -F 'DEMO_STAKES_CENTS.some(allowed=>allowed===stakeCents)' src/index.ts
          grep -F "for(const stakeCents of [35,50,75,100])" test/deriv-demo.test.ts
          grep -F "for(const stakeCents of [10,25,30,200])" test/deriv-demo.test.ts
      - name: Comprobar controles DEMO y activación automática solo tras consentimiento persistente
        run: |
          grep -F 'DEMO_BUY_ENABLED: bindings.text("true")' cloudflare.config.ts
          grep -F 'DEMO_AUTO_ENABLED: bindings.text("true")' cloudflare.config.ts
          grep -F "if(!await demo.isDemoAutoEnabled())return;" src/index.ts
          grep -F "/trading/v1/options/ws/demo" src/demo-trade-guards.ts
      - name: Validar la ruta alternativa DEMO sin habilitar cuenta REAL
        run: |
          grep -F 'oneBrowserDemoBuy' ../runtime/dashboard.html
          grep -F 'browserPublicContracts' ../runtime/dashboard.html
          grep -F 'demo-balanced-start' ../runtime/dashboard.html
          grep -F 'runBalancedDemoTrial' ../runtime/dashboard.html
          grep -F 'demo-export-csv' ../runtime/dashboard.html
          grep -F 'byDirection' ../runtime/demo-postmortem.mjs
          grep -F 'consecutiveLosses>=3' ../runtime/dashboard.html
          grep -F "connect-src 'self' wss://api.derivws.com;" src/index.ts
          grep -F 'beginBrowserPilot' src/deriv-demo.ts
          grep -F 'requireFirstDemoSettlement(verified)' src/deriv-demo.ts
          grep -F 'DEMO_BROWSER_CHANNEL_FORBIDDEN' ../runtime/dashboard.html
      - name: Verificar gateway MCP DEMO y aprobación propietaria
        run: |
          grep -F "if(url.pathname==='/mcp')" src/index.ts
          grep -F "MCP_BRIDGE_TOKEN" src/index.ts
          grep -F "request_demo_buy" src/mcp-gateway.ts
          grep -F "getBrowserSignal" src/deriv-demo.ts
          grep -F "mcp-approve" ../runtime/dashboard.html
          grep -F 'demo-apply-stake' ../runtime/dashboard.html
          grep -F 'DEMO_MANUAL_STAKE_SET' src/deriv-demo.ts
          grep -F 'syncBrokerBalance' ../runtime/dashboard.html
          grep -F "ticks:'R_100',subscribe:1" ../runtime/dashboard.html
          grep -F 'demo-max-concurrent' ../runtime/dashboard.html
          grep -F "browser-bot-buy" ../runtime/dashboard.html
          grep -F "completeMcpDemoIntent" src/deriv-demo.ts
      - name: Validar acceso seguro y publicar panel sin operaciones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configura las credenciales SOLO en GitHub Actions Secrets; no en código."
            exit 1
          fi
          npx cf deploy --prebuilt --mode production --message "Deriv DEMO manual habilitada; automatización solo opt-in después de liquidación"
      - name: Comprobar desde Internet la versión realmente servida por Cloudflare
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const release=JSON.parse(readFileSync('../release.json','utf8'));
          const expected=release.version+'.0';
          const url='https://ecopiensa-paper-10.instructor-andrade-dcc.workers.dev/api/health';
          let verified=false;
          for(let attempt=1;attempt<=6;attempt++){
            try{
              const response=await fetch(url,{signal:AbortSignal.timeout(10000)});
              if(!response.ok)throw Error('HTTP_'+response.status);
              const state=await response.json();
              if(state.status==='ok'&&state.version===expected){
                console.log('WORKER_LIVE_VERSION_VERIFIED '+expected+' (DEMO; no purchases)');
                verified=true;break;
              }
              console.log('WORKER_VERSION_MISMATCH expected='+expected+' got='+String(state.version).slice(0,20));
            }catch(error){
              console.log('WORKER_HEALTH_RETRY '+attempt+' '+(error instanceof Error?error.name:'ERROR'));
            }
            if(attempt<6)await new Promise(resolve=>setTimeout(resolve,4000));
          }
          if(!verified)process.exitCode=1;
          JS
      - name: Confirmar gateway MCP en producción sin credenciales públicas
        run: |
          node --input-type=module <<'JS'
          const host='https://ecopiensa-paper-10.instructor-andrade-dcc.workers.dev';
          const response=await fetch(host+'/api/health/mcp',{signal:AbortSignal.timeout(15000)});
          const data=await response.json();
          console.log('MCP_GATEWAY_PUBLISHED '+JSON.stringify({
            mode:data.mode,toolCount:data.toolCount,
            configured:data.configured,connectedToThisChat:data.connectedToThisChat,
            orderExecution:data.orderExecution
          }));
          if(!response.ok||data.mode!=='MCP_STAGING_DEMO_ONLY'
            ||data.orderExecution!=='OWNER_BROWSER_APPROVAL_ONLY'
            ||data.connectedToThisChat!==false)process.exitCode=1;
          const unauthorized=await fetch(host+'/mcp',{method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({jsonrpc:'2.0',id:1,method:'tools/list'})});
          if(![401,503].includes(unauthorized.status))process.exitCode=1;
          console.log('MCP_UNAUTHENTICATED_ACCESS_BLOCKED '+unauthorized.status);
          JS
      - name: Diagnosticar WebSocket Cloudflare y su fallback manual desde el navegador
        run: |
          node --input-type=module <<'JS'
          const url='https://ecopiensa-paper-10.instructor-andrade-dcc.workers.dev/api/health/deriv-socket';
          const response=await fetch(url,{signal:AbortSignal.timeout(20000)});
          const result=await response.json();
          console.log('DERIV_LIVE_PUBLIC_SOCKET '+JSON.stringify({
            status:result.status,version:result.version,code:result.code||null,
            markets:Array.isArray(result.markets)?result.markets.map(({symbol,state,call,put})=>({symbol,state,call,put})):null
          }));
          if(result.mode!=='PUBLIC_READ_ONLY'||result.readOnly!==true){
            process.exitCode=1;
          }else if(result.status==='CONNECTED'){
            console.log('Cloudflare puede conectar con Deriv directamente.');
          }else if(result.status==='UNAVAILABLE'&&['DERIV_SOCKET_CONNECT_ERROR','DERIV_SOCKET_CONNECT_CLOSED','DERIV_SOCKET_FAILED'].includes(result.code)){
            console.log('CLOUDFLARE_EGRESS_BLOCKED: la primera compra DEMO requiere el puente explícito de navegador; no se realizaron compras.');
          }else{
            process.exitCode=1;
          }
          JS
