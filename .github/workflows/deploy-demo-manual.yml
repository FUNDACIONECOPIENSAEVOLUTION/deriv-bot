name: Publicar Deriv DEMO en Cloudflare — aprobación manual
on:
  # v1.5: publish only after this workflow itself is explicitly reviewed and updated.
  # Every deployment keeps both broker DEMO buy switches OFF.
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-demo-manual.yml
  workflow_dispatch:
    inputs:
      confirmacion:
        description: 'Escribir PUBLICAR_SOLO_LECTURA para subir el panel con DEMO habilitada SOLO bajo autorización del propietario y primer contrato validado'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: cloudflare-demo-manual-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirmacion == 'PUBLICAR_SOLO_LECTURA' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: deriv-demo
    defaults:
      run:
        working-directory: cloudflare
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Instalar herramientas oficiales con dependencias fijadas
        run: npm ci --no-audit --no-fund
      - name: Verificar compilación, reglas DEMO y protección de dinero real
        run: |
          npm run typecheck
          npm test
          npm run build
          npx cf deploy --prebuilt --mode production --dry-run
      - name: Bloquear importes obsoletos y exigir la misma lista en HTTP y riesgo DEMO
        run: |
          grep -F 'DEMO_STAKES_CENTS=Object.freeze([35,50,75,100]' src/demo-risk-policy.ts
          grep -F 'DEMO_STAKES_CENTS.some(allowed=>allowed===stakeCents)' src/index.ts
          grep -F "for(const stakeCents of [35,50,75,100])" test/deriv-demo.test.ts
          grep -F "for(const stakeCents of [10,25,30,200])" test/deriv-demo.test.ts
      - name: Comprobar controles DEMO y activación automática solo tras consentimiento persistente
        run: |
          grep -F 'DEMO_BUY_ENABLED: bindings.text("true")' cloudflare.config.ts
          grep -F 'DEMO_AUTO_ENABLED: bindings.text("true")' cloudflare.config.ts
          grep -F "if(!await demo.isDemoAutoEnabled())return;" src/index.ts
          grep -F "/trading/v1/options/ws/demo" src/demo-trade-guards.ts
      - name: Validar acceso seguro y publicar panel sin operaciones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Configura las credenciales SOLO en GitHub Actions Secrets; no en código."
            exit 1
          fi
          npx cf deploy --prebuilt --mode production --message "Deriv DEMO manual habilitada; automatización solo opt-in después de liquidación"
