name: Validar adaptación PAPER para Cloudflare
on:
  pull_request:
    paths:
      - cloudflare/**
      - runtime/**
      - scripts/public_history_validation.mjs
      - .github/workflows/cloudflare-paper.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare
    env:
      CF_SEND_TELEMETRY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.0'
      - name: Instalar herramientas oficiales en el entorno temporal de GitHub
        run: npm ci --no-audit --no-fund
      - name: Conservar versiones resueltas para reproducir la compilación
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-dependency-lock
          path: cloudflare/package-lock.json
          retention-days: 3
      - name: Generar tipos y comprobar la compilación
        run: npm run typecheck
      - name: Probar HTTP privado, SQLite, recuperación y alarmas dentro de Workers
        run: npm test
      - name: Preparar compilación sin desplegar ni usar credenciales
        run: npm run build
      - name: Validar la salida preparada sin publicar recursos
        run: npx cf deploy --prebuilt --mode production --dry-run
      - name: Conservar la compilación lista para publicar
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-paper-prebuilt
          path: cloudflare/.cloudflare/output/v0/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
