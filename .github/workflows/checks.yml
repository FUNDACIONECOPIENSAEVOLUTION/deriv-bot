name: Validar laboratorio y servidor MCP
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias Python de investigación
        run: python -m pip install "mcp>=1.14,<2" "websockets>=14,<17"
      - name: Verificar sintaxis Python
        run: python -m py_compile mcp_research.py
      - name: Comprobar servidor de analistas
        run: node --check server.mjs
      - name: Validar HTML y seguridad básica
        run: node tests/test_html.mjs
      - name: Validar integridad de cotizaciones públicas con datos sintéticos de prueba
        run: node --test tests/test_public_history.mjs
      - name: Ejecutar pruebas unitarias sin conexión al broker
        run: python -m unittest discover -s tests -p 'test_*.py' -v
